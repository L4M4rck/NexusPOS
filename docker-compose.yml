name: nexuspos

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexuspos}
      MYSQL_USER: ${MYSQL_USER:-nexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-nexuspos};User=${MYSQL_USER:-nexus};Password=${MYSQL_PASSWORD:-change-me-local}
      Jwt__Secret: ${JWT_SECRET:-replace-with-at-least-32-characters-for-local-development}
      Jwt__Issuer: ${JWT_ISSUER:-NexusPOS}
      Jwt__Audience: ${JWT_AUDIENCE:-NexusPOS.Client}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-60}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-admin@nexuspos.local}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-Admin123!}
      Seed__CustomerPassword: ${SEED_CUSTOMER_PASSWORD:-Customer123!}
      Cors__AllowedOrigins__0: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
